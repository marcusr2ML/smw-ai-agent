name: Retro CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: mini_retro.yml
          activate-environment: retro_env

      - name: Run test
        shell: bash -l {0}
        run: |
          echo "Checking for .pyc files..."
          if find . -name "*.pyc" | grep -q .; then
            echo "ERROR: .pyc files found in repo"
            find . -name "*.pyc"
            exit 1
          fi

          echo "Checking for .py files..."
          if ! find . -name "*.py" | grep -q .; then
            echo "ERROR: No .py files found in repo"
            exit 1
          fi

          echo "OK: Python source structure is clean (.py present, no .pyc)"
